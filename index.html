<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shinchan — Your Little AI Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              shinchan: {
                cream: '#FFF9F0',
                red: '#E94B3C',
                redDark: '#D13B2D',
                yellow: '#FFD966',
                blue: '#CDE8F6',
                peach: '#FFE1D2',
                peachLight: '#FFF0E6',
                text: '#39332F',
                muted: '#7A6F68',
              },
            },
            fontFamily: {
              display: ['"Fredoka"', 'sans-serif'],
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            boxShadow: {
              soft: '0 8px 30px -6px rgba(57, 51, 47, 0.08)',
              card: '0 4px 20px -2px rgba(233, 75, 60, 0.08)',
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #FFF9F0;
        color: #39332F;
      }

      h1, h2, h3, .font-display {
        font-family: 'Fredoka', sans-serif;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #E6D7C8;
        border-radius: 9999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #D2BFA9;
      }

      .shinchan-prose p {
        margin-bottom: 0.75rem;
        line-height: 1.65;
      }

      .shinchan-prose p:last-child {
        margin-bottom: 0;
      }

      .shinchan-prose ul,
      .shinchan-prose ol {
        margin: 0.5rem 0 0.75rem 1.25rem;
      }

      .shinchan-prose ul {
        list-style-type: disc;
      }

      .shinchan-prose ol {
        list-style-type: decimal;
      }

      .shinchan-prose li {
        margin-bottom: 0.3rem;
      }

      .shinchan-prose h1,
      .shinchan-prose h2,
      .shinchan-prose h3 {
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        margin-top: 1rem;
        margin-bottom: 0.4rem;
        color: #39332F;
      }

      .shinchan-prose h1 {
        font-size: 1.25rem;
      }

      .shinchan-prose h2 {
        font-size: 1.125rem;
      }

      .shinchan-prose h3 {
        font-size: 1rem;
      }

      .shinchan-prose blockquote {
        border-left: 3px solid #FFD966;
        background-color: #FFF0E6;
        padding: 0.5rem 0.85rem;
        border-radius: 0 0.75rem 0.75rem 0;
        margin: 0.75rem 0;
      }

      @keyframes shinchanWave {
        0% { transform: rotate(-6deg); }
        100% { transform: rotate(10deg); }
      }

      .shinchan-waving {
        transform-origin: 60px 108px;
        animation: shinchanWave 0.55s ease-in-out infinite alternate;
      }

      @keyframes dotBounce {
        0%, 80%, 100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        40% {
          transform: translateY(-6px);
          opacity: 1;
        }
      }

      .dot-1 { animation: dotBounce 1.1s infinite ease-in-out 0s; }
      .dot-2 { animation: dotBounce 1.1s infinite ease-in-out 0.18s; }
      .dot-3 { animation: dotBounce 1.1s infinite ease-in-out 0.36s; }

      @keyframes msgFadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-msg {
        animation: msgFadeIn 0.24s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-[#FFF9F0] text-[#39332F] antialiased selection:bg-[#FFD966]/60">
    <!-- Signature Sliding Shinchan Entrance Overlay -->
    <div
      id="shinchan-entrance-stage"
      class="fixed bottom-6 right-0 z-50 pointer-events-none overflow-hidden pr-3 sm:pr-6 hidden"
      aria-live="polite"
    >
      <div
        id="shinchan-entrance-mover"
        class="flex items-end gap-2 sm:gap-3 transition-transform duration-500 ease-out"
        style="transform: translateX(130%); opacity: 0;"
      >
        <div
          id="shinchan-speech-bubble"
          class="relative mb-20 sm:mb-24 bg-white border-2 border-[#39332F] rounded-2xl px-4 py-2.5 shadow-soft max-w-[210px] sm:max-w-none transition-all duration-300 origin-bottom-right"
          style="opacity: 0; transform: scale(0.75) translateY(10px);"
        >
          <p class="font-display text-base sm:text-lg font-semibold text-[#39332F] whitespace-nowrap">
            Hola, how you doin&apos;?
          </p>
          <span
            class="absolute -right-2.5 bottom-3 w-4 h-4 bg-white border-r-2 border-b-2 border-[#39332F] rotate-[-45deg]"
            aria-hidden="true"
          ></span>
        </div>

        <div id="shinchan-entrance-character" class="shrink-0 drop-shadow-md"></div>
      </div>
    </div>

    <div class="h-screen w-screen overflow-hidden flex bg-[#FFF9F0] text-[#39332F]">
      <!-- Mobile Sidebar Backdrop -->
      <div
        id="sidebar-backdrop"
        onclick="toggleSidebar(false)"
        class="fixed inset-0 z-30 bg-[#39332F]/30 backdrop-blur-[1px] lg:hidden hidden"
      ></div>

      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="fixed lg:static inset-y-0 left-0 z-40 w-72 bg-[#FFF4E6] border-r border-[#F0E2D4] flex flex-col transition-transform duration-300 ease-out translate-x-0"
      >
        <div class="flex items-center justify-between px-4 py-4 border-b border-[#F0E2D4]">
          <button
            type="button"
            onclick="goToWelcome(true)"
            class="flex items-center gap-2.5 group text-left cursor-pointer"
          >
            <div
              id="sidebar-logo-slot"
              class="w-10 h-10 rounded-2xl bg-[#FFE1D2] border border-[#FFD966] flex items-center justify-center overflow-hidden shadow-sm group-hover:scale-105 transition-transform"
            ></div>
            <div>
              <span class="font-display text-xl font-bold text-[#39332F] block leading-none">
                Shinchan
              </span>
              <span class="text-[11px] text-[#7A6F68]">Personal AI Buddy</span>
            </div>
          </button>

          <button
            type="button"
            onclick="toggleSidebar(false)"
            class="p-2 rounded-xl text-[#7A6F68] hover:text-[#39332F] hover:bg-[#FFE1D2]/60 transition-colors cursor-pointer"
            title="Collapse sidebar"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
              <path d="m14 9-3 3 3 3" />
            </svg>
          </button>
        </div>

        <div class="p-3.5 space-y-2.5">
          <button
            type="button"
            onclick="startNewChat()"
            class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl bg-[#E94B3C] hover:bg-[#D13B2D] text-white font-semibold text-sm shadow-sm hover:shadow transition-all cursor-pointer"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
            <span>New Chat</span>
          </button>

          <div class="relative">
            <svg class="w-3.5 h-3.5 text-[#9E9189] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              id="history-search"
              type="text"
              oninput="renderSidebar()"
              placeholder="Search chats..."
              class="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-white/80 border border-[#F0E2D4] text-[#39332F] placeholder:text-[#9E9189] focus:outline-none focus:border-[#E94B3C]/60"
            />
          </div>
        </div>

        <div class="flex-1 overflow-y-auto px-3 space-y-1">
          <p class="px-2.5 py-1.5 text-[11px] font-bold uppercase tracking-wider text-[#9E9189]">
            Chat History
          </p>
          <div id="conversation-list" class="space-y-1"></div>
        </div>

        <div class="p-3.5 border-t border-[#F0E2D4] space-y-2.5">
          <div class="flex items-center gap-2.5 px-3 py-2 rounded-2xl bg-[#CDE8F6]/50 border border-[#CDE8F6]">
            <span class="text-sm shrink-0">★</span>
            <p class="text-[11px] text-[#39332F] leading-snug">
              <span class="font-semibold">Chocobi Tip:</span> Click Shinchan on the welcome screen for a wave!
            </p>
          </div>

          <button
            type="button"
            onclick="openSettings()"
            class="w-full flex items-center justify-between px-3 py-2.5 rounded-2xl text-sm font-medium text-[#39332F] hover:bg-white/80 transition-colors cursor-pointer"
          >
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 text-[#7A6F68]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>Settings</span>
            </span>
            <span id="mischief-badge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#FFD966]/70 text-[#39332F]">
              Balanced
            </span>
          </button>
        </div>
      </aside>

      <!-- Main Area -->
      <main class="flex-1 flex flex-col min-w-0 relative">
        <header
          id="collapsed-topbar"
          class="flex items-center justify-between px-4 py-3 border-b border-[#F0E2D4]/70 bg-[#FFF9F0] lg:hidden"
        >
          <button
            type="button"
            onclick="toggleSidebar(true)"
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white border border-[#F0E2D4] text-sm font-medium text-[#39332F] hover:bg-[#FFE1D2]/50 shadow-xs transition-colors cursor-pointer"
          >
            <svg class="w-4 h-4 text-[#E94B3C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
            </svg>
            <span class="font-display font-semibold">Shinchan</span>
          </button>

          <button
            type="button"
            onclick="startNewChat()"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#E94B3C] text-white text-xs font-semibold hover:bg-[#D13B2D] transition-colors cursor-pointer"
          >
            <span>+ New Chat</span>
          </button>
        </header>

        <!-- Welcome Screen -->
        <div
          id="welcome-view"
          class="relative flex-1 flex flex-col items-center justify-between px-4 py-6 sm:py-10 overflow-y-auto"
        >
          <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
            <span class="absolute top-12 left-[10%] text-[#FFD966] text-2xl select-none">★</span>
            <span class="absolute top-24 right-[14%] text-[#E94B3C]/40 text-xl select-none">✦</span>
            <span class="absolute bottom-36 left-[16%] text-[#CDE8F6] text-3xl select-none">●</span>
            <span class="absolute bottom-44 right-[12%] text-[#FFD966] text-xl select-none">✦</span>
          </div>

          <div class="w-full max-w-2xl my-auto flex flex-col items-center text-center z-10">
            <button
              type="button"
              onclick="triggerShinchanEntrance()"
              title="Click to replay Shinchan's greeting!"
              class="group relative mb-4 rounded-full p-2 bg-gradient-to-b from-[#FFE1D2] to-[#FFF9F0] border-2 border-[#FFD966] shadow-card cursor-pointer hover:scale-105 transition-transform"
            >
              <div id="welcome-character-slot"></div>
              <span class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-[#E94B3C] text-white text-[11px] font-semibold px-2.5 py-0.5 rounded-full shadow-sm whitespace-nowrap">
                Shinchan AI
              </span>
            </button>

            <h1 class="font-display text-3xl sm:text-5xl font-bold text-[#39332F] tracking-tight mt-2">
              Hola, welcome!
            </h1>

            <p class="mt-2.5 text-base sm:text-lg text-[#7A6F68] max-w-md">
              Your little buddy is here. What&apos;s on your mind?
            </p>

            <form
              onsubmit="handleFormSubmit(event, 'welcome-input')"
              class="w-full max-w-3xl mx-auto mt-7 bg-white rounded-3xl border-2 border-[#F0E2D4] focus-within:border-[#E94B3C]/60 shadow-soft transition-all duration-200 px-4 py-2.5"
            >
              <div class="flex items-end gap-2.5">
                <div
                  class="hidden sm:flex items-center justify-center w-8 h-8 mb-0.5 rounded-full bg-[#FFF0E6] text-[#E94B3C] shrink-0"
                  title="Chocobi Energy"
                >
                  ✦
                </div>
                <textarea
                  id="welcome-input"
                  rows="1"
                  oninput="autoResizeTextarea(this)"
                  onkeydown="handleTextareaKeydown(event, 'welcome-input')"
                  placeholder="Say something to Shinchan..."
                  class="flex-1 resize-none bg-transparent border-0 focus:outline-none text-[15px] text-[#39332F] placeholder:text-[#9E9189] py-1.5 max-h-[180px] leading-relaxed"
                ></textarea>
                <button
                  type="submit"
                  class="flex items-center justify-center w-10 h-10 rounded-2xl bg-[#E94B3C] hover:bg-[#D13B2D] text-white shadow-sm hover:scale-105 active:scale-95 transition-all shrink-0 cursor-pointer"
                  aria-label="Send message"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m22 2-7 20-4-9-9-4Z" />
                    <path d="M22 2 11 13" />
                  </svg>
                </button>
              </div>
            </form>

            <div class="w-full mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
              <button
                type="button"
                onclick="sendQuickPrompt('Hey Shinchan! Tell me a funny joke and strike your best Action Kamen pose!')"
                class="group flex items-start gap-3 p-3.5 rounded-2xl bg-white/90 hover:bg-white border border-[#F0E2D4] hover:border-[#E94B3C]/40 shadow-sm hover:shadow-card transition-all duration-200 cursor-pointer"
              >
                <span class="p-2 rounded-xl shrink-0 bg-[#FFE1D2] text-[#E94B3C] text-sm font-bold">☺</span>
                <div class="min-w-0">
                  <p class="text-sm font-semibold text-[#39332F] group-hover:text-[#E94B3C] transition-colors">
                    Tell me a cheeky joke
                  </p>
                  <p class="text-xs text-[#7A6F68] line-clamp-1 mt-0.5">
                    Action Kamen energy + lighthearted laughs
                  </p>
                </div>
              </button>

              <button
                type="button"
                onclick="sendQuickPrompt('Help me brainstorm 3 creative weekend coding project ideas.')"
                class="group flex items-start gap-3 p-3.5 rounded-2xl bg-white/90 hover:bg-white border border-[#F0E2D4] hover:border-[#E94B3C]/40 shadow-sm hover:shadow-card transition-all duration-200 cursor-pointer"
              >
                <span class="p-2 rounded-xl shrink-0 bg-[#FFD966]/50 text-[#39332F] text-sm font-bold">✦</span>
                <div class="min-w-0">
                  <p class="text-sm font-semibold text-[#39332F] group-hover:text-[#E94B3C] transition-colors">
                    Brainstorm a fun project
                  </p>
                  <p class="text-xs text-[#7A6F68] line-clamp-1 mt-0.5">
                    Fresh weekend ideas to build and ship
                  </p>
                </div>
              </button>

              <button
                type="button"
                onclick="sendQuickPrompt('Explain how transformers and attention work in AI simply and clearly.')"
                class="group flex items-start gap-3 p-3.5 rounded-2xl bg-white/90 hover:bg-white border border-[#F0E2D4] hover:border-[#E94B3C]/40 shadow-sm hover:shadow-card transition-all duration-200 cursor-pointer"
              >
                <span class="p-2 rounded-xl shrink-0 bg-[#CDE8F6] text-[#275D7A] text-sm font-bold">❖</span>
                <div class="min-w-0">
                  <p class="text-sm font-semibold text-[#39332F] group-hover:text-[#E94B3C] transition-colors">
                    Explain something simply
                  </p>
                  <p class="text-xs text-[#7A6F68] line-clamp-1 mt-0.5">
                    Clear explanations without the jargon fog
                  </p>
                </div>
              </button>

              <button
                type="button"
                onclick="sendQuickPrompt('Write a clean Python function to check if a string is a palindrome and explain edge cases.')"
                class="group flex items-start gap-3 p-3.5 rounded-2xl bg-white/90 hover:bg-white border border-[#F0E2D4] hover:border-[#E94B3C]/40 shadow-sm hover:shadow-card transition-all duration-200 cursor-pointer"
              >
                <span class="p-2 rounded-xl shrink-0 bg-[#FFE1D2] text-[#39332F] text-xs font-mono font-bold">&lt;/&gt;</span>
                <div class="min-w-0">
                  <p class="text-sm font-semibold text-[#39332F] group-hover:text-[#E94B3C] transition-colors">
                    Write or review clean code
                  </p>
                  <p class="text-xs text-[#7A6F68] line-clamp-1 mt-0.5">
                    Snippets, edge cases, and practical tips
                  </p>
                </div>
              </button>
            </div>
          </div>

          <p class="text-xs text-[#7A6F68]/80 mt-6 flex items-center gap-1.5">
            <span class="text-[#E94B3C]">✦</span>
            Powered by OpenAI • Cosy Shinchan Edition
          </p>
        </div>

        <!-- Active Chat View -->
        <div id="chat-view" class="flex-1 flex flex-col min-h-0 hidden">
          <div class="flex items-center justify-between px-4 sm:px-8 py-2.5 border-b border-[#F0E2D4]/80 bg-[#FFF9F0]/80 backdrop-blur-sm">
            <h2 id="chat-header-title" class="font-display text-base sm:text-lg font-semibold text-[#39332F] truncate">
              Chat
            </h2>

            <button
              type="button"
              onclick="clearCurrentChat()"
              title="Clear current chat"
              class="inline-flex items-center gap-1.5 text-xs font-medium text-[#7A6F68] hover:text-[#E94B3C] px-2.5 py-1.5 rounded-xl hover:bg-[#FFE1D2]/60 transition-colors shrink-0 cursor-pointer"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18" />
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
              </svg>
              <span class="hidden sm:inline">Clear chat</span>
            </button>
          </div>

          <div id="messages-container" class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-5"></div>

          <div class="px-4 sm:px-6 pb-4 pt-2 bg-gradient-to-t from-[#FFF9F0] via-[#FFF9F0] to-transparent">
            <form
              onsubmit="handleFormSubmit(event, 'chat-input')"
              class="w-full max-w-3xl mx-auto bg-white rounded-3xl border-2 border-[#F0E2D4] focus-within:border-[#E94B3C]/60 shadow-soft transition-all duration-200 px-4 py-2.5"
            >
              <div class="flex items-end gap-2.5">
                <div
                  class="hidden sm:flex items-center justify-center w-8 h-8 mb-0.5 rounded-full bg-[#FFF0E6] text-[#E94B3C] shrink-0"
                  title="Chocobi Energy"
                >
                  ✦
                </div>
                <textarea
                  id="chat-input"
                  rows="1"
                  oninput="autoResizeTextarea(this)"
                  onkeydown="handleTextareaKeydown(event, 'chat-input')"
                  placeholder="Say something to Shinchan..."
                  class="flex-1 resize-none bg-transparent border-0 focus:outline-none text-[15px] text-[#39332F] placeholder:text-[#9E9189] py-1.5 max-h-[180px] leading-relaxed"
                ></textarea>
                <button
                  id="chat-send-btn"
                  type="submit"
                  class="flex items-center justify-center w-10 h-10 rounded-2xl bg-[#E94B3C] hover:bg-[#D13B2D] disabled:bg-[#E6D7C8] text-white shadow-sm hover:scale-105 active:scale-95 transition-all shrink-0 cursor-pointer disabled:cursor-not-allowed"
                  aria-label="Send message"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m22 2-7 20-4-9-9-4Z" />
                    <path d="M22 2 11 13" />
                  </svg>
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <!-- Settings Modal -->
    <div
      id="settings-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-[#39332F]/40 backdrop-blur-xs"
    >
      <div class="w-full max-w-md bg-[#FFF9F0] border-2 border-[#F0E2D4] rounded-3xl p-6 shadow-soft animate-msg">

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-[#7A6F68] mb-2">
              OpenAI Model
            </label>
            <select
              id="model-select"
              onchange="setModel(this.value)"
              class="w-full rounded-2xl bg-white border border-[#F0E2D4] px-3.5 py-2.5 text-sm text-[#39332F] focus:outline-none focus:border-[#E94B3C]"

            >
              Delete All History

        </div>
      </div>
    </div>

    <script>
      /* =========================================================
         1. SHINCHAN CHARACTER ILLUSTRATIONS
      ========================================================= */

            <rect x="93" y="172" width="22" height="11" rx="5.5" fill="#FFD966" stroke="#39332F" stroke-width="3" />

            <path d="M56 48C56 32 72 24 91 24C110 24 122 36 122 54C122 70 114 88 94 90C79 91 63 90 53 81C44 73 45 58 56 48Z" fill="#FAD2B8" stroke="#39332F" stroke-width="3.2" stroke-linejoin="round" />
            <path d="M62 43C66 36 75 36 79 43" stroke="#2B2623" stroke-width="6" stroke-linecap="round" />
            <path d="M90 42C95 35 104 35 108 42" stroke="#2B2623" stroke-width="6" stroke-linecap="round" />
            <circle cx="71" cy="54" r="6" fill="#2B2623" />
            <circle cx="69" cy="52" r="2" fill="#FFFFFF" />
            <circle cx="98" cy="54" r="6" fill="#2B2623" />
            <circle cx="96" cy="52" r="2" fill="#FFFFFF" />
            <ellipse cx="60" cy="69" rx="7" ry="4.2" fill="#FF8C82" opacity="0.72" />
            <ellipse cx="109" cy="68" rx="6.5" ry="4" fill="#FF8C82" opacity="0.72" />
            <path d="M75 74C79 81 90 81 94 74" fill="#E94B3C" stroke="#39332F" stroke-width="3" stroke-linecap="round" />
          </svg>
        `;
      }

      /* =========================================================
         2. ENTRANCE ANIMATION CONTROLLER
      ========================================================= */
      let entranceTimers = [];

      function clearEntranceTimers() {
        entranceTimers.forEach((t) => clearTimeout(t));
        entranceTimers = [];
      }

      function triggerShinchanEntrance() {
        clearEntranceTimers();

        const stage = document.getElementById('shinchan-entrance-stage');
        const mover = document.getElementById('shinchan-entrance-mover');
        const bubble = document.getElementById('shinchan-speech-bubble');
        const charSlot = document.getElementById('shinchan-entrance-character');

        charSlot.innerHTML = getShinchanFullSVG('w-28 h-32 sm:w-36 sm:h-40', 'shinchan-waving');
        stage.classList.remove('hidden');
        mover.style.transform = 'translateX(130%)';
        mover.style.opacity = '0';
        bubble.style.opacity = '0';
        bubble.style.transform = 'scale(0.75) translateY(10px)';

        entranceTimers.push(
          setTimeout(() => {
            mover.style.transform = 'translateX(0)';
            mover.style.opacity = '1';
          }, 60)
        );

        entranceTimers.push(
          setTimeout(() => {
            bubble.style.opacity = '1';
            bubble.style.transform = 'scale(1) translateY(0)';
          }, 560)
        );

        entranceTimers.push(
          setTimeout(() => {
            bubble.style.opacity = '0';
            bubble.style.transform = 'scale(0.8) translateY(6px)';
          }, 2700)
        );

        entranceTimers.push(
          setTimeout(() => {
            mover.style.transform = 'translateX(130%)';
            mover.style.opacity = '0';
          }, 3000)
        );

        entranceTimers.push(
          setTimeout(() => {
            stage.classList.add('hidden');
          }, 3600)
        );
      }

      /* =========================================================
         3. STATE & LOCAL STORAGE
      ========================================================= */
      const STORAGE_CHATS_KEY = 'shinchan_conversations_v1';
      const STORAGE_SETTINGS_KEY = 'shinchan_settings_v1';

      const state = {
        conversations: [],
        activeId: null,
        editingId: null,
        isLoading: false,
        sidebarOpen: true,
        deleteConfirmArmed: false,
        settings: {
          model: 'gpt-4o-mini',
          playfulness: 'balanced',
        },
      };

      function loadState() {
        try {
          const rawChats = localStorage.getItem(STORAGE_CHATS_KEY);
          if (rawChats) state.conversations = JSON.parse(rawChats);
        } catch {}

        try {
          const rawSettings = localStorage.getItem(STORAGE_SETTINGS_KEY);
          if (rawSettings) {
            state.settings = { ...state.settings, ...JSON.parse(rawSettings) };
          }
        } catch {}

        if (window.innerWidth < 1024) {
          toggleSidebar(false);
        }
      }

      function persistConversations() {
        try {
          localStorage.setItem(STORAGE_CHATS_KEY, JSON.stringify(state.conversations));
        } catch {}
      }

      function persistSettings() {
        try {
          localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(state.settings));
        } catch {}
      }

      function generateTitle(text) {
        const clean = text.replace(/\s+/g, ' ').trim();
        if (!clean) return 'New Adventure';
        return clean.length > 34 ? `${clean.slice(0, 34)}...` : clean;
      }

      /* =========================================================
         4. BACKEND API CALL (/api/chat)
      ========================================================= */
      async function fetchShinchanReply(messages) {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: messages.filter((m) => !m.isError),
            model: state.settings.model || 'gpt-4o-mini',
            playfulness: state.settings.playfulness || 'balanced',
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || `Shinchan had a hiccup (Status ${response.status}). Please try again!`
          );
        }

        if (!data.reply) {
          throw new Error('Shinchan got tongue-tied and returned an empty response!');
        }

        return data.reply;
      }

      /* =========================================================
         5. SAFE MARKDOWN + CODE BLOCK PARSER
      ========================================================= */
      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      const codeStore = {};
      let codeCounter = 0;

      function formatInlineMarkdown(text) {
        let html = escapeHTML(text);
        html = html.replace(
          /`([^`]+)`/g,
          '<code class="px-1.5 py-0.5 rounded-md bg-[#FFF0E6] text-[#D13B2D] font-mono text-[13px]">$1</code>'
        );
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        return html;
      }

      function renderMarkdown(rawText) {
        const segments = rawText.split(/(```[\s\S]*?```)/g);

        return segments
          .map((segment) => {
            if (segment.startsWith('```') && segment.endsWith('```')) {
              const inner = segment.slice(3, -3);
              const firstNewline = inner.indexOf('\n');
              let lang = 'code';
              let codeBody = inner;
              if (firstNewline !== -1) {
                const possibleLang = inner.slice(0, firstNewline).trim();
                if (possibleLang && /^[a-zA-Z0-9_+-]+$/.test(possibleLang)) {
                  lang = possibleLang;
                  codeBody = inner.slice(firstNewline + 1);
                }
              }
              const codeId = `code_${++codeCounter}`;
              codeStore[codeId] = codeBody.replace(/\n$/, '');

              return `
                <div class="my-3 rounded-2xl overflow-hidden border border-[#39332F]/15 bg-[#2B2623] text-[#FFF9F0]">
                  <div class="flex items-center justify-between px-3.5 py-1.5 bg-[#39332F] text-xs text-[#FFD966]">
                    <span class="font-mono uppercase tracking-wider">${escapeHTML(lang)}</span>
                    <button
                      type="button"
                      onclick="copyCodeBlock('${codeId}', this)"
                      class="flex items-center gap-1.5 px-2 py-0.5 rounded-lg hover:bg-white/10 text-white/90 transition-colors cursor-pointer"
                    >
                      <span>Copy code</span>
                    </button>
                  </div>
                  <pre class="p-3.5 overflow-x-auto text-sm font-mono leading-relaxed"><code>${escapeHTML(codeStore[codeId])}</code></pre>
                </div>
              `;
            }

            const lines = segment.split('\n');
            let out = '';
            let inUl = false;
            let inOl = false;

            const closeLists = () => {
              if (inUl) { out += '</ul>'; inUl = false; }
              if (inOl) { out += '</ol>'; inOl = false; }
            };

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed) {
                closeLists();
                continue;
              }

              if (trimmed.startsWith('### ')) {
                closeLists();
                out += `<h3>${formatInlineMarkdown(trimmed.slice(4))}</h3>`;
              } else if (trimmed.startsWith('## ')) {
                closeLists();
                out += `<h2>${formatInlineMarkdown(trimmed.slice(3))}</h2>`;
              } else if (trimmed.startsWith('# ')) {
                closeLists();
                out += `<h1>${formatInlineMarkdown(trimmed.slice(2))}</h1>`;
              } else if (trimmed.startsWith('> ')) {
                closeLists();
                out += `<blockquote>${formatInlineMarkdown(trimmed.slice(2))}</blockquote>`;
              } else if (/^[-*]\s+/.test(trimmed)) {
                if (inOl) { out += '</ol>'; inOl = false; }
                if (!inUl) { out += '<ul>'; inUl = true; }
                out += `<li>${formatInlineMarkdown(trimmed.replace(/^[-*]\s+/, ''))}</li>`;
              } else if (/^\d+\.\s+/.test(trimmed)) {
                if (inUl) { out += '</ul>'; inUl = false; }
                if (!inOl) { out += '<ol>'; inOl = true; }
                out += `<li>${formatInlineMarkdown(trimmed.replace(/^\d+\.\s+/, ''))}</li>`;
              } else {
                closeLists();
                out += `<p>${formatInlineMarkdown(trimmed)}</p>`;
              }
            }
            closeLists();
            return out;
          })
          .join('');
      }

      /* =========================================================
         6. UI RENDERING
      ========================================================= */
      function toggleSidebar(forceState) {
        state.sidebarOpen = typeof forceState === 'boolean' ? forceState : !state.sidebarOpen;
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const topbar = document.getElementById('collapsed-topbar');

        if (state.sidebarOpen) {
          sidebar.classList.remove('-translate-x-full', 'lg:hidden');
          sidebar.classList.add('translate-x-0');
          backdrop.classList.remove('hidden');
          topbar.classList.add('lg:hidden');
        } else {
          sidebar.classList.add('-translate-x-full', 'lg:hidden');
          sidebar.classList.remove('translate-x-0');
          backdrop.classList.add('hidden');
          topbar.classList.remove('lg:hidden');
        }
      }

      function renderSidebar() {
        const listEl = document.getElementById('conversation-list');
        const query = (document.getElementById('history-search')?.value || '').toLowerCase().trim();

        const filtered = state.conversations.filter((c) =>
          c.title.toLowerCase().includes(query)
        );

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div class="px-3 py-8 text-center">
              <p class="text-xs font-medium text-[#7A6F68]">
                ${query ? 'No matching chats found' : 'No adventures yet!'}
              </p>
              <p class="text-[11px] text-[#9E9189] mt-1">
                ${query ? 'Try another keyword.' : 'Start chatting with Shinchan to save your conversations.'}
              </p>
            </div>
          `;
          return;
        }

        listEl.innerHTML = filtered
          .map((conv) => {
            const isActive = conv.id === state.activeId;
            const isEditing = conv.id === state.editingId;

            if (isEditing) {
              return `
                <div class="flex items-center gap-1 px-2.5 py-2 rounded-2xl bg-white border border-[#E94B3C] shadow-sm">
                  <input
                    id="rename-input-${conv.id}"
                    type="text"
                    value="${escapeHTML(conv.title)}"
                    onkeydown="handleRenameKeydown(event, '${conv.id}')"
                    class="w-full text-xs bg-[#FFF9F0] rounded-lg px-2 py-1 focus:outline-none text-[#39332F]"
                  />
                  <button type="button" onclick="commitRename('${conv.id}')" class="p-1 text-emerald-600 hover:bg-emerald-50 rounded cursor-pointer" title="Save">✓</button>
                  <button type="button" onclick="cancelRename()" class="p-1 text-[#7A6F68] hover:bg-[#FFE1D2] rounded cursor-pointer" title="Cancel">✕</button>
                </div>
              `;
            }

            return `
              <div
                onclick="selectConversation('${conv.id}')"
                class="group flex items-center gap-2.5 px-3 py-2.5 rounded-2xl cursor-pointer transition-all ${
                  isActive
                    ? 'bg-white text-[#39332F] shadow-sm border border-[#FFD966]'
                    : 'text-[#5C524B] hover:bg-white/65'
                }"
              >
                <svg class="w-4 h-4 shrink-0 ${isActive ? 'text-[#E94B3C]' : 'text-[#9E9189]'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
                </svg>
                <span class="flex-1 text-xs sm:text-[13px] font-medium truncate">
                  ${escapeHTML(conv.title)}
                </span>
                <div class="flex sm:hidden group-hover:flex items-center gap-0.5 shrink-0">
                  <button
                    type="button"
                    onclick="event.stopPropagation(); beginRename('${conv.id}')"
                    title="Rename"
                    class="p-1 rounded-lg text-[#7A6F68] hover:text-[#39332F] hover:bg-[#FFE1D2]/70 cursor-pointer"
                  >✎</button>
                  <button
                    type="button"
                    onclick="event.stopPropagation(); deleteConversation('${conv.id}')"
                    title="Delete"
                    class="p-1 rounded-lg text-[#7A6F68] hover:text-[#E94B3C] hover:bg-[#FFE1D2]/70 cursor-pointer"
                  >🗑</button>
                </div>
              </div>
            `;
          })
          .join('');
      }

      const messageStore = {};

      function renderChatArea() {
        const welcomeView = document.getElementById('welcome-view');
        const chatView = document.getElementById('chat-view');
        const activeConv = state.conversations.find((c) => c.id === state.activeId);

        if (!activeConv || activeConv.messages.length === 0) {
          welcomeView.classList.remove('hidden');
          chatView.classList.add('hidden');
          return;
        }

        welcomeView.classList.add('hidden');
        chatView.classList.remove('hidden');

        document.getElementById('chat-header-title').textContent = activeConv.title;
        const container = document.getElementById('messages-container');

        let html = activeConv.messages
          .map((msg) => {
            messageStore[msg.id] = msg.content;
            if (msg.role === 'user') {
              return `
                <div class="flex justify-end max-w-3xl mx-auto animate-msg">
                  <div class="max-w-[85%] sm:max-w-[75%] bg-[#E94B3C] text-white rounded-3xl rounded-br-md px-4 py-3 shadow-sm">
                    <p class="text-[15px] whitespace-pre-wrap leading-relaxed">${escapeHTML(msg.content)}</p>
                  </div>
                </div>
              `;
            }

            if (msg.isError) {
              return `
                <div class="flex items-start gap-3 max-w-3xl mx-auto animate-msg">
                  <div class="w-9 h-9 rounded-2xl bg-[#FFE1D2] border border-[#FFD966] flex items-center justify-center shrink-0 overflow-hidden shadow-sm mt-0.5">
                    ${getShinchanHeadSVG('w-8 h-8')}
                  </div>
                  <div class="flex-1 min-w-0 rounded-3xl rounded-tl-md px-4 sm:px-5 py-3.5 shadow-sm border bg-[#FFE1D2]/75 border-[#E94B3C]/40 text-[#39332F]">
                    <p class="font-semibold text-sm text-[#E94B3C]">Oops! Shinchan tripped!</p>
                    <p class="mt-0.5 text-sm">${escapeHTML(msg.content)}</p>
                  </div>
                </div>
              `;
            }

            return `
              <div class="flex items-start gap-3 max-w-3xl mx-auto animate-msg">
                <div class="w-9 h-9 rounded-2xl bg-[#FFE1D2] border border-[#FFD966] flex items-center justify-center shrink-0 overflow-hidden shadow-sm mt-0.5">
                  ${getShinchanHeadSVG('w-8 h-8')}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="rounded-3xl rounded-tl-md px-4 sm:px-5 py-3.5 shadow-sm border bg-white border-[#F0E2D4] text-[#39332F]">
                    <div class="shinchan-prose text-[15px]">
                      ${renderMarkdown(msg.content)}
                    </div>
                  </div>
                  <div class="mt-1.5 flex items-center gap-2 pl-1">
                    <button
                      type="button"
                      onclick="copyMessageText('${msg.id}', this)"
                      class="inline-flex items-center gap-1.5 text-xs text-[#7A6F68] hover:text-[#E94B3C] px-2 py-1 rounded-lg hover:bg-[#FFE1D2]/50 transition-colors cursor-pointer"
                    >
                      <span>Copy</span>
                    </button>
                  </div>
                </div>
              </div>
            `;
          })
          .join('');

        if (state.isLoading) {
          html += `
            <div class="flex items-start gap-3 max-w-3xl mx-auto animate-msg">
              <div class="w-9 h-9 rounded-2xl bg-[#FFE1D2] border border-[#FFD966] flex items-center justify-center shrink-0 overflow-hidden shadow-sm">
                ${getShinchanHeadSVG('w-8 h-8')}
              </div>
              <div class="bg-white border border-[#F0E2D4] rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm flex items-center gap-3">
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-[#E94B3C] dot-1"></span>
                  <span class="w-2 h-2 rounded-full bg-[#E94B3C] dot-2"></span>
                  <span class="w-2 h-2 rounded-full bg-[#E94B3C] dot-3"></span>
                </div>
                <span class="text-xs font-medium text-[#7A6F68]">Shinchan is thinking...</span>
              </div>
            </div>
          `;
        }

        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
      }

      /* =========================================================
         7. USER ACTIONS
      ========================================================= */
      function autoResizeTextarea(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 180) + 'px';
      }

      function handleTextareaKeydown(e, inputId) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleFormSubmit(e, inputId);
        }
      }

      function handleFormSubmit(e, inputId) {
        e.preventDefault();
        const input = document.getElementById(inputId);
        const text = input.value.trim();
        if (!text || state.isLoading) return;
        input.value = '';
        input.style.height = 'auto';
        sendMessage(text);
      }

      function sendQuickPrompt(promptText) {
        if (state.isLoading) return;
        sendMessage(promptText);
      }

      async function sendMessage(text) {
        const userMsg = {
          id: `msg_${Date.now()}_u`,
          role: 'user',
          content: text,
          createdAt: Date.now(),
        };

        let targetId = state.activeId;
        let conv = state.conversations.find((c) => c.id === targetId);

        if (!conv) {
          targetId = `conv_${Date.now()}`;
          conv = {
            id: targetId,
            title: generateTitle(text),
            messages: [userMsg],
            updatedAt: Date.now(),
          };
          state.conversations.unshift(conv);
          state.activeId = targetId;
        } else {
          if (conv.messages.length === 0) {
            conv.title = generateTitle(text);
          }
          conv.messages.push(userMsg);
          conv.updatedAt = Date.now();
        }

        state.isLoading = true;
        persistConversations();
        renderSidebar();
        renderChatArea();

        const sendBtn = document.getElementById('chat-send-btn');
        if (sendBtn) sendBtn.disabled = true;

        try {
          const reply = await fetchShinchanReply(conv.messages);
          conv.messages.push({
            id: `msg_${Date.now()}_a`,
            role: 'assistant',
            content: reply,
            createdAt: Date.now(),
          });
        } catch (err) {
          conv.messages.push({
            id: `msg_${Date.now()}_err`,
            role: 'assistant',
            content: err.message || 'Network hiccup while reaching Shinchan.',
            isError: true,
            createdAt: Date.now(),
          });
        } finally {
          state.isLoading = false;
          if (sendBtn) sendBtn.disabled = false;
          persistConversations();
          renderChatArea();
        }
      }

      function startNewChat() {
        state.activeId = null;
        if (window.innerWidth < 1024) toggleSidebar(false);
        renderSidebar();
        renderChatArea();
        triggerShinchanEntrance();
        setTimeout(() => document.getElementById('welcome-input')?.focus(), 100);
      }

      function goToWelcome(replay = false) {
        state.activeId = null;
        if (window.innerWidth < 1024) toggleSidebar(false);
        renderSidebar();
        renderChatArea();
        if (replay) triggerShinchanEntrance();
      }

      function selectConversation(id) {
        state.activeId = id;
        if (window.innerWidth < 1024) toggleSidebar(false);
        renderSidebar();
        renderChatArea();
      }

      function beginRename(id) {
        state.editingId = id;
        renderSidebar();
        const input = document.getElementById(`rename-input-${id}`);
        if (input) {
          input.focus();
          input.select();
        }
      }

      function handleRenameKeydown(e, id) {
        if (e.key === 'Enter') commitRename(id);
        if (e.key === 'Escape') cancelRename();
      }

      function commitRename(id) {
        const input = document.getElementById(`rename-input-${id}`);
        const newTitle = input?.value.trim();
        if (newTitle) {
          const conv = state.conversations.find((c) => c.id === id);
          if (conv) conv.title = newTitle;
          persistConversations();
        }
        state.editingId = null;
        renderSidebar();
        renderChatArea();
      }

      function cancelRename() {
        state.editingId = null;
        renderSidebar();
      }

      function deleteConversation(id) {
        state.conversations = state.conversations.filter((c) => c.id !== id);
        if (state.activeId === id) {
          state.activeId = null;
        }
        persistConversations();
        renderSidebar();
        renderChatArea();
      }

      function clearCurrentChat() {
        const conv = state.conversations.find((c) => c.id === state.activeId);
        if (!conv) return;
        conv.messages = [];
        persistConversations();
        renderChatArea();
      }

      async function copyMessageText(msgId, btn) {
        const text = messageStore[msgId];
        if (!text) return;
        await navigator.clipboard.writeText(text);
        const label = btn.querySelector('span');
        const original = label.textContent;
        label.textContent = 'Copied!';
        label.classList.add('text-emerald-700', 'font-semibold');
        setTimeout(() => {
          label.textContent = original;
          label.classList.remove('text-emerald-700', 'font-semibold');
        }, 1600);
      }

      async function copyCodeBlock(codeId, btn) {
        const code = codeStore[codeId];
        if (!code) return;
        await navigator.clipboard.writeText(code);
        const label = btn.querySelector('span');
        label.textContent = 'Copied!';
        setTimeout(() => {
          label.textContent = 'Copy code';
        }, 1600);
      }

      /* =========================================================
         8. SETTINGS MODAL
      ========================================================= */
      function openSettings() {
        state.deleteConfirmArmed = false;
        const delBtn = document.getElementById('delete-all-btn');
        if (delBtn) delBtn.textContent = 'Delete All History';
        const modelSelect = document.getElementById('model-select');
        if (modelSelect) modelSelect.value = state.settings.model || 'gpt-4o-mini';
        updateMischiefUI();
        const modal = document.getElementById('settings-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeSettings() {
        const modal = document.getElementById('settings-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      function setModel(modelName) {
        state.settings.model = modelName;
        persistSettings();
      }

      function setPlayfulness(level) {
        state.settings.playfulness = level;
        persistSettings();
        updateMischiefUI();
      }

      function updateMischiefUI() {
        const level = state.settings.playfulness;
        const labels = {
          focused: 'Calm',
          balanced: 'Balanced',
          extra: 'Extra Cheeky',
        };
        const descs = {
          focused: 'Subtle charm with crisp, direct, focused answers.',
          balanced: 'Warm, witty, and playful while keeping answers sharp and clear.',
          extra: 'Maximum Shinchan energy, Chocobi jokes, and lively warmth!',
        };

        document.getElementById('mischief-badge').textContent = labels[level] || 'Balanced';
        document.getElementById('mischief-desc').textContent = descs[level] || descs.balanced;

        document.querySelectorAll('.mischief-option').forEach((btn) => {
          if (btn.dataset.level === level) {
            btn.className =
              'mischief-option py-2.5 px-3 rounded-xl text-xs font-semibold border transition-all cursor-pointer bg-[#FFD966] border-[#39332F] text-[#39332F]';
          } else {
            btn.className =
              'mischief-option py-2.5 px-3 rounded-xl text-xs font-semibold border transition-all cursor-pointer bg-white border-[#F0E2D4] text-[#7A6F68] hover:border-[#39332F]/30';
          }
        });
      }

      function handleDeleteAllHistory() {
        const btn = document.getElementById('delete-all-btn');
        if (!state.deleteConfirmArmed) {
          state.deleteConfirmArmed = true;
          btn.textContent = 'Click again to confirm';
          return;
        }
        state.conversations = [];
        state.activeId = null;
        state.deleteConfirmArmed = false;
        persistConversations();
        renderSidebar();
        renderChatArea();
        closeSettings();
      }

      /* =========================================================
         9. BOOTSTRAP APP
      ========================================================= */
      window.addEventListener('DOMContentLoaded', () => {
        loadState();
        document.getElementById('sidebar-logo-slot').innerHTML = getShinchanHeadSVG('w-9 h-9');
        document.getElementById('welcome-character-slot').innerHTML = getShinchanFullSVG();
        updateMischiefUI();
        renderSidebar();
        renderChatArea();
        triggerShinchanEntrance();
      });
    </script>
  </body>
</html>
